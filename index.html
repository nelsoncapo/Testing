<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orbital Moons</title>
  <style>
    /* Full-page canvas backdrop */
    html, body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background: radial-gradient(120% 120% at 50% 30%, #0f5d93 0%, #042b45 60%, #021d2f 100%);
      color: #e8f3ff;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      height: 100%;
    }

    body {
      min-height: 300vh; /* create scroll room for interactions */
    }

    #hero {
      position: sticky;
      top: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .caption {
      position: fixed;
      inset: 3rem auto auto 3rem;
      max-width: 26rem;
      line-height: 1.5;
      letter-spacing: 0.01em;
      backdrop-filter: blur(8px);
      background: rgba(5, 22, 38, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1.25rem 1.5rem;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }

    .caption h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      font-weight: 700;
    }

    .caption p {
      margin: 0;
      font-size: 1rem;
      color: #c8d9f0;
    }
  </style>
</head>
<body>
  <div class="caption">
    <h1>Azure Giant &amp; Twin Moons</h1>
    <p>Scroll to guide the rotation. The moons orbit with each scroll tick, casting crisp, moving shadows across a vivid 8K-grade scene.</p>
  </div>
  <div id="hero"></div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js";

    const container = document.getElementById("hero");
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(0, 6, 20);

    // Ambient base
    scene.add(new THREE.AmbientLight(0x0f1c2a, 0.45));

    // Key light (casts strong, crisp shadows)
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(12, 18, 16);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(4096, 4096);
    dirLight.shadow.camera.left = -25;
    dirLight.shadow.camera.right = 25;
    dirLight.shadow.camera.top = 25;
    dirLight.shadow.camera.bottom = -25;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 80;
    dirLight.shadow.radius = 1.4;
    scene.add(dirLight);

    // Fill rim light for energetic highlights
    const rimLight = new THREE.PointLight(0x5bd9ff, 0.45, 80, 1.5);
    rimLight.position.set(-18, 5, -12);
    scene.add(rimLight);

    // Ground to catch shadows
    const groundGeo = new THREE.PlaneGeometry(160, 160);
    const groundMat = new THREE.ShadowMaterial({ opacity: 0.45 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -6;
    ground.receiveShadow = true;
    scene.add(ground);

    // Large planet
    const planetGeo = new THREE.SphereGeometry(6, 256, 256);
    const planetMat = new THREE.MeshStandardMaterial({
      color: new THREE.Color("#0b4f7d"),
      roughness: 0.32,
      metalness: 0.08,
      emissive: new THREE.Color("#166fa7").multiplyScalar(0.25),
      emissiveIntensity: 1.0
    });
    const planet = new THREE.Mesh(planetGeo, planetMat);
    planet.castShadow = true;
    planet.receiveShadow = true;
    scene.add(planet);

    // Moons
    const moonGeo = new THREE.SphereGeometry(1.1, 128, 128);
    const moonOrange = new THREE.MeshStandardMaterial({
      color: "#E95C1B",
      roughness: 0.24,
      metalness: 0.15,
      emissive: new THREE.Color("#ff8c42").multiplyScalar(0.3)
    });
    const moonBurgundy = new THREE.MeshStandardMaterial({
      color: "#611D21",
      roughness: 0.26,
      metalness: 0.18,
      emissive: new THREE.Color("#ae3038").multiplyScalar(0.2)
    });

    const moon1 = new THREE.Mesh(moonGeo, moonOrange);
    const moon2 = new THREE.Mesh(moonGeo, moonBurgundy);
    moon1.castShadow = moon1.receiveShadow = true;
    moon2.castShadow = moon2.receiveShadow = true;

    // Orbit groups to keep paths tidy
    const orbit1 = new THREE.Group();
    const orbit2 = new THREE.Group();
    orbit1.add(moon1);
    orbit2.add(moon2);
    scene.add(orbit1, orbit2);

    const orbitRadius1 = 10.2;
    const orbitRadius2 = 8.8;

    const clock = new THREE.Clock();
    let scrollProgress = 0;

    const onScroll = () => {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      scrollProgress = maxScroll > 0 ? window.scrollY / maxScroll : 0;
    };
    window.addEventListener("scroll", onScroll);
    onScroll();

    const onResize = () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    };
    window.addEventListener("resize", onResize);

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();
      const baseAngle = scrollProgress * Math.PI * 2;

      // Planet rotation influenced by scroll and time
      planet.rotation.y = baseAngle + t * 0.1;
      planet.rotation.x = Math.sin(scrollProgress * Math.PI) * 0.2;

      // Light tracks subtly to keep shadows dynamic
      dirLight.position.x = 14 * Math.cos(baseAngle + 0.7);
      dirLight.position.z = 14 * Math.sin(baseAngle + 0.7) + 6 * Math.sin(t * 0.2);
      dirLight.target = planet;

      // Moons orbit with scroll-driven advance + time
      const orbitSpeed1 = 0.4 + scrollProgress * 0.8;
      const orbitSpeed2 = 0.25 + scrollProgress * 0.7;
      const angle1 = baseAngle * 1.6 + t * orbitSpeed1;
      const angle2 = baseAngle * 1.2 - t * orbitSpeed2;

      moon1.position.set(
        Math.cos(angle1) * orbitRadius1,
        Math.sin(angle1 * 1.3) * 2.6,
        Math.sin(angle1) * orbitRadius1
      );

      moon2.position.set(
        Math.cos(angle2) * orbitRadius2,
        Math.sin(angle2 * 1.5) * 1.9,
        Math.sin(angle2) * orbitRadius2
      );

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
